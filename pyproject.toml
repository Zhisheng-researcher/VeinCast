[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veincast"
version = "0.1.0"
description = "Physics-guided global medium-range weather forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "xarray>=2023.1",
  "netCDF4>=1.6",
  "tqdm>=4.65",
]

[project.scripts]
veincast-train = "veincast.cli.train:main"
veincast-evaluate = "veincast.cli.evaluate:main"
veincast-predict = "veincast.cli.predict:main"

[tool.setuptools.packages.find]
include = ["veincast*"]
